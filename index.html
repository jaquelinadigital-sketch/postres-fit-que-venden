<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postres Fit que Venden</title>
<meta name="description" content="Tu plan para ganar tu propia plata desde tu cocina con postres saludables.">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234E7A5C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 11h16l-2 9H6z'/%3E%3Cpath d='M5 11a7 7 0 0 1 14 0'/%3E%3Cpath d='M12 4V2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFDF9; --ink:#3B2F2A; --muted:#7A6B63; --line:#EEE3D5;
  --sage:#7FA38A; --sage-d:#4A7558; --sage-l:#E4EEE6; --rasp:#D45D79; --rasp-d:#B23F5C; --rasp-l:#FBE4EA;
  --cream2:#F5ECDF; --warn:#9A5A12; --warn-l:#FDF1DC;
  --r:22px; --r-sm:16px;
  --shadow:0 10px 28px rgba(110,85,60,.09), 0 2px 6px rgba(110,85,60,.05);
  --shadow-sm:0 4px 14px rgba(110,85,60,.08);
  --font:"Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sage-d)}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:900;letter-spacing:-.01em}
p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:var(--r-sm);border:0;font-weight:800;font-size:1rem;transition:transform .12s ease, background .2s, box-shadow .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--sage-d);color:#fff;box-shadow:0 8px 18px rgba(74,117,88,.28)}
.btn-primary:hover{background:#3f664b}
.btn-rasp{background:var(--rasp-d);color:#fff;box-shadow:0 8px 18px rgba(178,63,92,.25)}
.btn-rasp:hover{background:#9c3450}
.btn-soft{background:var(--sage-l);color:var(--sage-d)}
.btn-soft:hover{background:#d8e7dc}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-ghost:hover{background:var(--cream2)}
.btn-block{width:100%}
.btn-sm{min-height:42px;padding:0 16px;font-size:.92rem;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-sm);display:inline-grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:#fff}
.link{background:none;border:0;padding:6px 0;color:var(--sage-d);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- Tarjetas ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid rgba(238,227,213,.7)}
.card + .card{margin-top:16px}
.card h3{font-size:1.15rem;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sage-d)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--sage-l);color:var(--sage-d);font-weight:800;font-size:.82rem}
.pill.rasp{background:var(--rasp-l);color:var(--rasp-d)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.alert{border-radius:14px;padding:12px 14px;background:var(--warn-l);color:var(--warn);font-weight:700;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.alert.ok{background:var(--sage-l);color:var(--sage-d)}
.alert.rasp{background:var(--rasp-l);color:var(--rasp-d)}
.note{font-size:.86rem;color:var(--muted);background:var(--cream2);border-radius:14px;padding:10px 14px}

/* ---------- Formularios ---------- */
label.lbl{display:block;font-weight:800;font-size:.92rem;margin-bottom:6px}
.field{margin-bottom:14px}
.input, select.input, textarea.input{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1rem;transition:border .2s}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:none;border-color:var(--sage)}
.input.err{border-color:var(--rasp)}
.err-msg{color:var(--rasp-d);font-weight:700;font-size:.86rem;margin-top:6px;min-height:1em}
.money{display:flex;align-items:stretch;gap:8px}
.money .sym{display:grid;place-items:center;min-width:52px;padding:0 10px;border-radius:14px;background:var(--cream2);font-weight:900}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--sage-d)}

/* ---------- Onboarding ---------- */
#onb{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.onb-box{width:100%;max-width:520px}
.welcome-badge{width:88px;height:88px;border-radius:28px;background:linear-gradient(145deg,var(--sage-l),#fff);display:grid;place-items:center;color:var(--sage-d);box-shadow:var(--shadow);margin-bottom:22px}
.welcome h1{font-size:clamp(2.1rem,7vw,3rem)}
.welcome h1 span{color:var(--rasp-d)}
.welcome .sub{font-size:1.15rem;color:var(--muted);margin:10px 0 22px;font-weight:600}
.promise li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-weight:700}
.promise li .dot{width:30px;height:30px;border-radius:10px;background:var(--rasp-l);color:var(--rasp-d);display:grid;place-items:center;flex:none}
.promise{list-style:none;padding:0;margin:0 0 26px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.progress{flex:1;height:10px;background:var(--cream2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-d));border-radius:99px;transition:width .35s ease}
.qcount{font-weight:800;color:var(--muted);font-size:.9rem;min-width:40px;text-align:right}
.qtitle{font-size:clamp(1.5rem,5vw,2rem);margin-bottom:8px}
.qhelp{color:var(--muted);margin-bottom:22px;font-weight:600}
.opt{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:14px 18px;margin-bottom:12px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.05rem;box-shadow:var(--shadow-sm);transition:border .15s, background .15s}
.opt:hover{border-color:var(--sage)}
.opt.sel{border-color:var(--sage-d);background:var(--sage-l)}
.opt .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.opt.sel .tick{background:var(--sage-d);border-color:var(--sage-d)}
.loading{text-align:center}
.spinner{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;border:8px solid var(--sage-l);border-top-color:var(--sage-d);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-steps{list-style:none;padding:0;margin:18px auto 0;max-width:320px;text-align:left}
.load-steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--muted);font-weight:700;transition:color .3s}
.load-steps li.on{color:var(--sage-d)}
.reveal h1{font-size:clamp(1.8rem,6vw,2.4rem)}
.reveal-units{display:flex;align-items:baseline;gap:10px;margin:6px 0}
.reveal-units b{font-size:3.2rem;line-height:1;color:var(--rasp-d);font-weight:900}
.mini-postres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.mini-postres .p{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.mini-postres .p .ph{aspect-ratio:1}
.mini-postres .p span{display:block;padding:8px 10px 10px;font-weight:800;font-size:.86rem;line-height:1.2}

/* ---------- Estructura app ---------- */
#app{min-height:100vh}
.sidebar{display:none}
.main{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem}
.brand-ic{width:38px;height:38px;border-radius:13px;background:var(--sage-l);color:var(--sage-d);display:grid;place-items:center}
.topbar .actions{display:flex;gap:8px}
#view{padding:8px 16px 140px;max-width:620px;margin:0 auto;outline:none}
.page-title{font-size:clamp(1.7rem,6vw,2.2rem);margin:8px 0 4px}
.page-title span{color:var(--rasp-d)}
.page-sub{color:var(--muted);font-weight:600;margin-bottom:18px}
.bottomnav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;background:var(--card);border-radius:26px;box-shadow:0 14px 34px rgba(110,85,60,.16);display:grid;grid-template-columns:repeat(5,1fr);padding:8px;border:1px solid var(--line)}
.nav-btn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:18px;font-weight:800;font-size:.72rem;color:var(--muted);min-height:56px;justify-content:center}
.nav-btn.on{color:var(--sage-d);background:var(--sage-l)}
.sos-fab{position:fixed;right:18px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 92px);z-index:31;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px 12px 14px;background:var(--rasp-d);color:#fff;font-weight:900;box-shadow:0 10px 24px rgba(178,63,92,.35)}
.sos-fab:hover{background:#9c3450}

/* ---------- Hoy ---------- */
.hero{background:linear-gradient(150deg,#fff 0%,var(--sage-l) 100%);}
.hero .day{font-size:1.5rem;margin:6px 0 4px}
.stat{display:flex;align-items:center;gap:14px}
.stat .big{font-size:2.2rem;font-weight:900;line-height:1}
.flame{width:56px;height:56px;border-radius:18px;background:var(--rasp-l);color:var(--rasp-d);display:grid;place-items:center;flex:none}
.bar{height:14px;border-radius:99px;background:var(--cream2);overflow:hidden;margin:10px 0 6px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--rasp),var(--rasp-d));border-radius:99px;transition:width .4s}
.bar.sage > i{background:linear-gradient(90deg,var(--sage),var(--sage-d))}
.hoy-grid{display:grid;gap:16px}
.hoy-grid .card + .card{margin-top:0}
.chip-list{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Plan ---------- */
.stage{margin-top:22px}
.stage h3{font-size:1.05rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stage h3 .n{width:30px;height:30px;border-radius:10px;background:var(--sage-l);color:var(--sage-d);display:grid;place-items:center;font-size:.9rem}
.days{display:grid;grid-template-columns:1fr;gap:10px}
.day-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow-sm);font-weight:800}
.day-btn .num{width:42px;height:42px;border-radius:14px;background:var(--cream2);display:grid;place-items:center;font-weight:900;flex:none}
.day-btn.done{border-color:var(--sage)}
.day-btn.done .num{background:var(--sage-d);color:#fff}
.day-btn.next{border-color:var(--rasp)}
.day-btn.next .num{background:var(--rasp-l);color:var(--rasp-d)}
.day-btn small{display:block;color:var(--muted);font-weight:700}

/* ---------- Postres ---------- */
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rcard{display:flex;flex-direction:column;text-align:left;padding:10px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border:1px solid rgba(238,227,213,.7);transition:transform .15s}
.rcard:hover{transform:translateY(-2px)}
.rcard .ph{aspect-ratio:1;border-radius:16px}
.rcard h4{font-size:.98rem;margin:10px 4px 4px}
.rcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 4px;font-size:.78rem;color:var(--muted);font-weight:700}
.rcard .mine{position:absolute}
.ph{position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(74,117,88,.55);background:linear-gradient(145deg,#EAF1EC,#F8E7EC)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.g-horneado{background:linear-gradient(145deg,#F6E7D6,#EAF1EC)}
.ph.g-galleta{background:linear-gradient(145deg,#F3E4D2,#FBE4EA)}
.ph.g-vaso{background:linear-gradient(145deg,#FBE4EA,#EAF1EC)}
.ph.g-bocado{background:linear-gradient(145deg,#EDE1D6,#FBE4EA)}
.ph .tag{position:absolute;left:8px;top:8px;background:rgba(255,253,249,.92);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:900;display:flex;gap:4px;align-items:center}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;font-size:.92rem;min-height:44px}
.tab.on{background:var(--sage-d);border-color:var(--sage-d);color:#fff}

/* ---------- Ficha (modal grande) ---------- */
.ficha-hero{position:relative;height:300px;margin:-20px -20px 0;border-radius:0}
.ficha-hero .ph{position:absolute;inset:0;border-radius:0}
.ficha-hero .top-actions{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;z-index:2}
.ficha-body{position:relative;margin:-28px -20px 0;background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px 8px}
.ficha-body h2{font-size:1.7rem}
.facts{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 4px;color:var(--muted);font-weight:800;font-size:.92rem}
.facts span{display:flex;align-items:center;gap:6px}
.ing-list{list-style:none;padding:0;margin:8px 0}
.ing-list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ing-list li button{width:28px;height:28px;border-radius:50%;border:2px solid var(--sage);background:#fff;display:grid;place-items:center;color:#fff;flex:none;padding:0}
.ing-list li.ok button{background:var(--sage-d);border-color:var(--sage-d)}
.ing-list li.ok span{text-decoration:line-through;color:var(--muted)}
.steps{padding-left:0;list-style:none;counter-reset:s;margin:8px 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--rasp-l);color:var(--rasp-d);display:grid;place-items:center;font-weight:900;flex:none}
.sticky-cta{position:sticky;bottom:0;margin:16px -20px -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,253,249,0),var(--card) 30%);display:flex;gap:10px}
.sticky-cta .btn{flex:1}

/* ---------- Precios ---------- */
.ing-row{padding:14px 0;border-bottom:1px solid var(--line)}
.ing-row:last-child{border-bottom:0}
.ing-row .name{font-weight:800}
.ing-row .inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ing-row .inputs label{font-size:.78rem;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.ing-row .inputs .input{min-height:46px;padding:10px 12px}
.ing-row .unit-wrap{display:flex;gap:6px;align-items:center}
.ing-row .unit-wrap span{font-weight:800;color:var(--muted);font-size:.85rem}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:700}
.sum-row b{font-weight:900}
.sum-row.total{border-bottom:0;font-size:1.1rem}
.big-price{font-size:2rem;font-weight:900;color:var(--sage-d)}

/* ---------- Ventas ---------- */
.order{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}
.order .info{flex:1;min-width:0}
.order .info b{display:block}
.order .info small{color:var(--muted);font-weight:700}
.shop li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.shop{list-style:none;padding:0;margin:0}
.shop li input{width:24px;height:24px;accent-color:var(--sage-d);flex:none}
.shop li.ok span{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-weight:700}
.empty .ic{color:var(--sage);margin-bottom:8px}

/* ---------- Bonos ---------- */
.msg{background:var(--cream2);border-radius:16px;padding:14px;margin-top:12px}
.msg p{white-space:pre-wrap}
.msg .row{margin-top:10px}
table.cal{width:100%;border-collapse:collapse}
table.cal td,table.cal th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.94rem}
table.cal th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.menu-day{padding:12px 0;border-bottom:1px solid var(--line)}
.menu-day:last-child{border-bottom:0}
.menu-day b{color:var(--sage-d)}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(59,47,42,.45);padding:0}
.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:up .25s ease;position:relative}
.sheet.full{max-height:100vh;height:100vh;border-radius:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{font-size:1.35rem}
.preview-img{width:100%;max-width:340px;display:block;margin:0 auto;border-radius:18px;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#printArea{display:none}

/* ---------- Computadora y tablet ---------- */
@media (min-width:900px){
  #app{display:grid;grid-template-columns:260px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(255,253,249,.6)}
  .sidebar .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.1rem;line-height:1.15;margin-bottom:22px;padding:0 8px}
  .side-btn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:16px;font-weight:800;color:var(--muted);text-align:left;width:100%;min-height:50px}
  .side-btn:hover{background:var(--cream2);color:var(--ink)}
  .side-btn.on{background:var(--sage-d);color:#fff;box-shadow:0 8px 18px rgba(74,117,88,.25)}
  .side-sep{height:1px;background:var(--line);margin:10px 8px}
  .sidebar .foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px}
  .bottomnav{display:none}
  .topbar{padding:18px 40px}
  .topbar .actions,.topbar .brand{display:none}
  .topbar{min-height:0;padding:0;background:none;position:static}

function num(v){if(v===null||v===undefined)return NaN;const s=String(v).trim().replace(/\s/g,"");if(!s)return NaN;
  // Acepta 1.500,50 / 1,500.50 / 1500,5 / 1500.5
  let t=s;if(t.includes(",")&&t.includes(".")){t=t.lastIndexOf(",")>t.lastIndexOf(".")?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");}
  else if(/^\d{1,3}([.,]\d{3})+$/.test(t)){t=t.replace(/[.,]/g,"");}
  else if(t.includes(",")){t=t.replace(",",".");}
  return parseFloat(t);}
function cur(){return MONEDAS.find(m=>m.c===S.profile.moneda)||MONEDAS[0];}
function fmtNum(n,dec){const c=cur();const neg=n<0;let v=Math.abs(n);const f=Math.pow(10,dec);v=Math.round(v*f)/f;
  let [ip,dp]=v.toFixed(dec).split(".");if(dp&&/^0+$/.test(dp))dp="";
  const ts=c.m?",":".",dsep=c.m?".":",";ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,ts);return (neg?"-":"")+ip+(dp?dsep+dp:"");}
function fmt(n,forceDec){if(n===null||n===undefined||isNaN(n))return "—";const c=cur();const dec=forceDec??c.d;return c.s+" "+fmtNum(Number(n),dec);}

function niceRound(x){const c=cur();if(c.d>0){return x<20?Math.ceil(x*2)/2:Math.ceil(x);}
  const step=x<100?5:x<1000?10:x<10000?50:100;return Math.ceil(x/step)*step;}
function qtyTx(q,u){if(u==="u"){const n=Math.ceil(q);return n+(n===1?" unidad":" unidades");}

  return Math.round(q)+" "+u;}

function ingUnitCost(k){const g=S.ings[k];if(!g)return null;const p=num(g.price),pk=num(g.pack);if(!(p>=0)||!(pk>0))return null;return p/pk;}
function recipeCost(id){const r=R[id];let ing=0;const missing=[];
  for(const [k,q] of r.ings){const uc=ingUnitCost(k);if(uc===null)missing.push(k);else ing+=uc*q;}
  const cfg=S.cfg[id]||{};const emp=num(cfg.empaque);const empaque=(emp>=0?emp:0)*r.rinde;
  const gas=ing*0.10;const total=ing+gas+empaque;
  return {ing,gas,empaque,total,unit:total/r.rinde,missing,complete:missing.length===0};}
function suggested(id){const c=recipeCost(id);return c.complete&&c.unit>0?niceRound(c.unit*2.5):null;}
function getPrecio(id){const p=num((S.cfg[id]||{}).precio);if(p>0)return p;return suggested(id);}
function getCostoUnit(id){const c=recipeCost(id);return c.complete?c.unit:null;}
function orderGan(o){const cu=o.costUnit??getCostoUnit(o.recipe);return cu===null?null:(o.price-cu)*o.qty;}
function sumPeriod(fromDate,toDate){let ventas=0,gan=0,sinCosto=0;
  for(const o of S.orders){const d=parseD(o.date);if(d<fromDate||d>toDate)continue;ventas+=o.price*o.qty;const g=orderGan(o);if(g===null)sinCosto++;else gan+=g;}
  return {ventas,gan,sinCosto};}
function monthStats(){const n=new Date();const a=new Date(n.getFullYear(),n.getMonth(),1);const b=new Date(n.getFullYear(),n.getMonth()+1,0,23,59);return sumPeriod(a,b);}
function weekStats(){const a=monday(new Date());const b=addDays(a,6);b.setHours(23,59);return sumPeriod(a,b);}
function exactGanUnit(){const ids=S.plan?.postres||[];const g=[];for(const id of ids){const p=getPrecio(id),c=getCostoUnit(id);if(p!==null&&c!==null&&p-c>0)g.push(p-c);}return g.length?g.reduce((a,b)=>a+b,0)/g.length:null;}
function unitsWeek(){const meta=num(S.profile.meta);if(!(meta>0))return null;const g=exactGanUnit();
  if(g)return {n:Math.ceil(meta/(g*4.3)),exact:true};
  const pr=num(S.profile.precioRef);if(!(pr>0))return null;return {n:Math.ceil(meta/(pr*0.6*4.3)),exact:false};}
function firstGan(){const os=[...S.orders].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);for(const o of os){const g=orderGan(o);if(g!==null&&g>0)return g;}return null;}

/* --- Racha con comodín semanal --- */
function addActivity(){const t=today();if(!S.activity.includes(t)){S.activity.push(t);}save();}
function streak(){const act=new Set(S.activity);if(!act.size)return {n:0,comodin:false};
  const first=[...act].sort()[0];let d=new Date();const used=new Set();let n=0;
  if(!act.has(ds(d)))d=addDays(d,-1);
  for(let i=0;i<400;i++){const s=ds(d);if(s<first)break;
    if(act.has(s))n++;else{const wk=weekKey(d);if(used.has(wk))break;used.add(wk);}
    d=addDays(d,-1);}
  return {n,comodin:used.has(weekKey(new Date()))};}
function daysDone(){return Object.keys(S.days).filter(k=>S.days[k]?.done).length;}
function nextDay(){for(let i=1;i<=14;i++)if(!S.days[i]?.done)return i;return null;}

/* --- Elección de los 3 postres según el quiz --- */
function pickPostres(a){
  let list=RECIPES.slice();
  if(a.horno==="no")list=list.filter(r=>r.horno!=="horno");
  if(a.experiencia==="nada")list=list.filter(r=>r.dif===1);
  const score=r=>{let s=r.base||0;
    if(a.experiencia==="budines"&&["budin","muffins","brownie","alfajores"].includes(r.id))s+=3;
    if(a.experiencia==="frios"&&(r.grupo==="vaso"||r.id==="bombones"))s+=3;
    if(a.publico==="trabajo"&&r.individual)s+=2;
    if(a.publico==="vecinas"&&r.uso.includes("vecinas"))s+=2;
    if(a.publico==="familia"&&r.uso.includes("regalo"))s+=1;
    if(a.publico==="escuela"&&r.uso.includes("escuela"))s+=1;
    if(a.inversion==="minimo"&&r.costo==="bajo")s+=2;
    if(r.dif===1)s+=1;return s;};
  list.sort((x,y)=>score(y)-score(x));
  const picked=[];
  const can=r=>{if(picked.includes(r))return false;
    if(picked.filter(p=>p.grupo===r.grupo).length>=2)return false;
    if(a.horno==="aveces"&&r.horno==="horno"&&picked.some(p=>p.horno==="horno"))return false;return true;};
  const req=a.publico==="familia"?"regalo":a.publico==="escuela"?"escuela":null;
  if(req){const r=list.find(x=>x.uso.includes(req)&&can(x));if(r)picked.push(r);}
  for(const r of list){if(picked.length>=3)break;if(can(r))picked.push(r);}
  return picked.map(r=>r.id);
}

/* ---------- Vista: Precios ---------- */

/* ---------- Vista: Ventas ---------- */
function shoppingList(){const pend=S.orders.filter(o=>!o.entregado);const tot={};
  for(const o of pend){const r=R[o.recipe];const tandas=Math.ceil(o.qty/r.rinde);for(const [k,q] of r.ings){tot[k]=(tot[k]||0)+q*tandas;}}
  return Object.entries(tot).map(([k,q])=>{const i=INGS[k];const pk=num(S.ings[k]?.pack)>0?num(S.ings[k].pack):i.pack;const packs=i.u==="u"&&pk===1?null:Math.ceil(q/pk);
    return {k,q,txt:qtyTx(q,i.u),packs,pk,u:i.u};});}

    <div class="stack">
      <div class="card"><p class="eyebrow">Meta de ${mesNombre(new Date())}</p><h3 class="mt8">${falta>0?`Te faltan ${fmt(falta)}`:"¡Meta cumplida!"}</h3>

        <button class="btn btn-rasp btn-block mt16" data-act="nuevoPedido">${ic("plus")} Nuevo pedido</button></div>
      <div class="card"><h3>Por preparar</h3>${pend.length?pend.map(orderRow).join(""):`<div class="empty">${ic("receipt",34)}<p>No tienes pedidos pendientes.</p></div>`}</div>

    <div class="field"><label class="lbl" for="lbContacto">Contacto (opcional)</label><input class="input" id="lbContacto" data-prof="contacto" maxlength="40" value="${esc(S.profile.contacto||"")}" placeholder="WhatsApp o Instagram"></div>

/* ================== EVENTOS DE LAS VISTAS ================== */
function bindView(v){
  fillIcons(v);
  // ingredientes
  $$("[data-ingp],[data-ingk]",v).forEach(inp=>inp.addEventListener("change",()=>{
    const k=inp.dataset.ingp||inp.dataset.ingk;const field=inp.dataset.ingp?"price":"pack";const val=num(inp.value);
    S.ings[k]=S.ings[k]||{};
    if(inp.value.trim()===""){delete S.ings[k][field];}
    else if(!(val>=0)||(field==="pack"&&!(val>0))){toast(field==="pack"?"El tamaño debe ser mayor que cero":"Escribe un precio válido (sin números negativos)");inp.value=S.ings[k][field]??"";return;}
    else S.ings[k][field]=val;
    save();keepFocusRender(inp.id);}));
  $$("[data-cfg]",v).forEach(inp=>inp.addEventListener("change",()=>{
    const id=S.precioId;const f=inp.dataset.cfg;const val=num(inp.value);S.cfg[id]=S.cfg[id]||{};
    if(inp.value.trim()===""){delete S.cfg[id][f];}
    else if(!(val>=0)||(f==="precio"&&!(val>0))){toast("Escribe un número válido mayor que cero");inp.value=S.cfg[id][f]??"";return;}
    else S.cfg[id][f]=val;
    save();keepFocusRender(inp.id);}));
  const other=$("#otherRecipe",v);if(other)other.onchange=()=>{if(other.value)go("precios",{precio:other.value});};
  const mp=$("#msgPostre",v);if(mp)mp.onchange=()=>{S.msgPostre=mp.value;save();render();};
  $$("[data-prof]",v).forEach(inp=>inp.addEventListener("change",()=>{S.profile[inp.dataset.prof]=inp.value.trim();save();}));
  $$("[data-shop]",v).forEach(cb=>cb.onchange=()=>{S.comprado[cb.dataset.shop]=cb.checked;save();cb.closest("li").classList.toggle("ok",cb.checked);});
}
function keepFocusRender(lastId){const ae=document.activeElement;const nextId=ae&&ae.id&&ae.id!==lastId?ae.id:null;const y=window.scrollY;render();window.scrollTo(0,y);if(nextId){const el=document.getElementById(nextId);if(el)el.focus();}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-day],[data-ficha],[data-precio],[data-bono],[data-deliver],[data-delorder],[data-copymsg]");
  if(!t)return;
  if(t.dataset.go){closeModal();return go(t.dataset.go);}
  if(t.dataset.day)return openDay(+t.dataset.day);
  if(t.dataset.ficha)return openFicha(t.dataset.ficha);
  if(t.dataset.precio)return go("precios",{precio:t.dataset.precio});
  if(t.dataset.bono)return go("bonos",{bono:t.dataset.bono});
  if(t.dataset.deliver){const o=S.orders.find(x=>x.id===t.dataset.deliver);if(o){o.entregado=true;addActivity();save();render();toast("¡Entregado! Bien hecho");}return;}
  if(t.dataset.delorder){if(confirm("¿Borrar este pedido?")){S.orders=S.orders.filter(x=>x.id!==t.dataset.delorder);save();render();}return;}
  if(t.dataset.copymsg){return copyText($("#msg"+t.dataset.copymsg).textContent);}
  const a=t.dataset.act;
  if(a==="sos")return openSOS();
  if(a==="ajustes")return openAjustes();
  if(a==="checkin"){addActivity();render();toast("¡Día registrado! Tu racha sigue");return;}
  if(a==="premio")return openPremio();
  if(a==="carta")return openCarta();
  if(a==="nuevoPedido")return openPedido();
  if(a==="copyList"){const l=shoppingList();return copyText("Lista de compras · Postres Fit que Venden\n"+l.map(x=>`• ${ingName(x.k)}: ${x.txt}${x.packs?` (≈ ${x.packs} ${x.packs===1?"paquete":"paquetes"})`:""}`).join("\n"));}
  if(a==="resetShop"){S.comprado={};save();render();return;}
  if(a==="printLabels")return printLabels();
});

/* ================== MODALES ================== */
let lastFocus=null;
function openModal(html,cls=""){lastFocus=document.activeElement;const m=$("#modal");m.innerHTML=`<div class="sheet ${cls}">${html}</div>`;m.hidden=false;document.body.style.overflow="hidden";fillIcons(m);
  const f=m.querySelector("[data-autofocus]")||m.querySelector("button,input,select,textarea");if(f)setTimeout(()=>f.focus(),60);}
function closeModal(){const m=$("#modal");if(m.hidden)return;m.hidden=true;m.innerHTML="";document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.closest("[data-close]"))closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
const head=(t)=>`<div class="sheet-head"><h2>${t}</h2><button class="icon-btn" data-close aria-label="Cerrar">${ic("close")}</button></div>`;

/* --- Día --- */
function openDay(n){const d=DAYS[n];const st=STAGES.find(s=>s.days.includes(n));const isDone=S.days[n]?.done;
  let extra="";
  if(d.notes)extra+=`<div class="field mt16"><label class="lbl" for="dayNotes">Tus notas</label><textarea class="input" id="dayNotes" placeholder="¿Cómo salió? ¿Qué te dijeron?">${esc(S.notes[n]||"")}</textarea></div>`;
  if(d.brand)extra+=`<div class="field mt16"><label class="lbl" for="dayBrand">Nombre de tu emprendimiento</label><input class="input" id="dayBrand" maxlength="40" value="${esc(S.profile.marca||"")}" placeholder="Ej.: Las delicias de Caro"></div>`;
  if(d.list)extra+=`<ul class="mt12" style="padding-left:20px;font-weight:700">${d.list.map(x=>`<li style="padding:4px 0">${x}</li>`).join("")}</ul>`;
  openModal(`${head(`Día ${n}`)}<p class="eyebrow">Etapa ${st.n}: ${st.t} · 10 minutos</p><h2 class="mt8" style="font-size:1.6rem">${d.t}</h2>
    <p class="mt12" style="font-size:1.05rem">${d.tx}</p>${extra}
    ${d.go?`<button class="btn btn-soft btn-block mt16" id="dayGo">${d.goTx}</button>`:""}
    <div class="note mt16" style="background:var(--rasp-l);color:var(--rasp-d);font-weight:800">${ic("star",16)} ${d.an}</div>
    <button class="btn ${isDone?"btn-ghost":"btn-primary"} btn-block mt16" id="dayDone">${isDone?"Marcar como no hecho":ic("check")+" ¡Hecho!"}</button>`);

  lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length*lh;}

    <p class="small muted mt12" style="text-align:center">Ideal para el estado de WhatsApp y tus historias.</p>`);
  $("#imgDl").onclick=()=>cv.toBlob(b=>downloadBlob(b,name),"image/png");
  $("#imgSh")?.addEventListener("click",()=>cv.toBlob(async b=>{const file=new File([b],name,{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Postres Fit"});else downloadBlob(b,name);}catch(_){}} ,"image/png"));
}
function openPremio(){shareImage("premio",{},"¡Lista para vender!");}

/* --- Mi carta de precios --- */
function openCarta(){const mine=S.plan.postres;
  openModal(`${head("Mi carta de precios")}
  <div class="field"><label class="lbl" for="cMarca">Nombre de tu emprendimiento</label><input class="input" id="cMarca" maxlength="40" value="${esc(S.profile.marca||"")}" placeholder="Ej.: Las delicias de Caro"></div>
  <div class="field"><label class="lbl" for="cCont">Contacto (opcional)</label><input class="input" id="cCont" maxlength="40" value="${esc(S.profile.contacto||"")}" placeholder="WhatsApp o Instagram"></div>
  <p class="lbl">Formato</p><div class="row wrap"><label class="check"><input type="radio" name="cFmt" value="historia" checked> Historia o estado (1080 × 1920)</label><label class="check"><input type="radio" name="cFmt" value="post"> Publicación (1080 × 1350)</label></div>
  <p class="lbl mt12">Postres (hasta 6)</p>${RECIPES.map(r=>{const has=getPrecio(r.id)!==null;return `<label class="check"><input type="checkbox" data-cp="${r.id}" ${mine.includes(r.id)?"checked":""}> ${esc(r.n)} <span class="small ${has?"muted":""}" style="font-weight:700;${has?"":"color:var(--warn)"}">· ${has?fmt(getPrecio(r.id)):"sin precio"}</span></label>`;}).join("")}
  <div id="cWarn"></div>
  <button class="btn btn-rasp btn-block mt16" id="cGen">${ic("image")} Generar mi carta</button>`);
  $("#cGen").onclick=()=>{S.profile.marca=$("#cMarca").value.trim();S.profile.contacto=$("#cCont").value.trim();save();
    const ids=$$("[data-cp]").filter(c=>c.checked).map(c=>c.dataset.cp);const fmtSel=$$("[name=cFmt]").find(x=>x.checked).value;
    if(!ids.length){$("#cWarn").innerHTML=`<div class="alert mt12">Elige al menos un postre.</div>`;return;}
    const max=fmtSel==="post"?5:6;if(ids.length>max){$("#cWarn").innerHTML=`<div class="alert mt12">Para este formato elige hasta ${max} postres.</div>`;return;}
    const sinPrecio=ids.filter(id=>getPrecio(id)===null);
    if(sinPrecio.length){$("#cWarn").innerHTML=`<div class="alert mt12">${ic("star",18)}<span>Estos postres no tienen precio cargado: ${sinPrecio.map(id=>R[id].n).join(", ")}. Cárgalo en Precios o quítalos de la carta.</span></div>
      <div class="row wrap mt12"><button class="btn btn-soft btn-sm" data-go="precios">Ir a Precios</button>${ids.length>sinPrecio.length?`<button class="btn btn-ghost btn-sm" id="cSin">Generar sin esos</button>`:""}</div>`;fillIcons($("#cWarn"));
      $("#cSin")?.addEventListener("click",()=>shareImage(fmtSel,{ids:ids.filter(id=>!sinPrecio.includes(id))},"Mi carta de precios"));return;}
    shareImage(fmtSel,{ids},"Mi carta de precios");};
}

/* ================== INICIO ================== */
fillIcons();
if(S.profile.done&&S.plan){startApp();}else{renderOnb();}
</script>
</body>
</html>
